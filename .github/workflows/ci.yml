name: iOS CI

on: [push, pull_request]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Build
        run: xcodebuild -scheme "LeaveNow" -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone 15' build | xcpretty

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcversion select || xcodebuild -version
      - name: Build placeholder (project to be added)
        run: echo "Stub CI until Xcode project is generated"
