name: iOS CI

on: [push, pull_request]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project LeaveNow.xcodeproj \
            -scheme "LeaveNow" \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            build
