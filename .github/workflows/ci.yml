name: iOS CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      # Secrets.plist is git-ignored; the build needs the resource to exist.
      # Use the placeholder template so the project compiles (no live keys in CI).
      - name: Provide placeholder Secrets.plist
        run: cp App/Support/Secrets.plist.example App/Support/Secrets.plist

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show Xcode version
        run: xcodebuild -version

      # Pick whatever iPhone simulator the runner actually has, so we don't break
      # when Xcode images change the bundled device/runtime names.
      - name: Select a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; c=[x for rt in d for x in d[rt] if x.get('isAvailable') and x['name'].startswith('iPhone')]; print(c[0]['udid'] if c else '')")
          if [ -z "$UDID" ]; then echo "No available iPhone simulator found"; exit 1; fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Selected simulator UDID: $UDID"

      - name: Build & test
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme LeaveNow \
            -sdk iphonesimulator \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO
