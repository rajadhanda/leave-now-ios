name: iOS CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      # Secrets.plist is git-ignored; the build needs the resource to exist.
      # Use the placeholder template so the project compiles (no live keys in CI).
      - name: Provide placeholder Secrets.plist
        run: cp App/Support/Secrets.plist.example App/Support/Secrets.plist

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build & test
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme LeaveNow \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            CODE_SIGNING_ALLOWED=NO
