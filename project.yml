name: LeaveNow
options:
  minimumXcodeGenVersion: 2.34.0
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  configs:
    Debug: debug
    Release: release
settings:
  base:
    SWIFT_VERSION: 5.9
    PRODUCT_BUNDLE_IDENTIFIER: com.example.LeaveNow
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0
    CODE_SIGN_STYLE: Automatic
    # Set your Apple Developer Team ID here to enable device builds
    # DEVELOPMENT_TEAM: YOUR_TEAM_ID
    INFOPLIST_FILE: App/Resources/Info.plist
packages: {}
targets:
  LeaveNow:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Tests
    resources:
      - App/Resources
      - App/Support/Secrets.plist
    settings:
      base:
        PRODUCT_NAME: Leave Now?
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    preBuildScripts: []
    postBuildScripts: []
    dependencies: []
    scheme:
      testTargets:
        - LeaveNowTests
      gatherCoverageData: true
      environmentVariables:
        MOCK_DATA: YES
  LeaveNowTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    settings:
      base:
        TEST_HOST: ""
        BUNDLE_LOADER: ""
    dependencies:
      - target: LeaveNow
schemes:
  LeaveNow-Debug:
    build:
      targets:
        LeaveNow: all
    run:
      config: Debug
      environmentVariables:
        MOCK_DATA: YES
    test:
      config: Debug
      targets: [LeaveNowTests]
  LeaveNow-Release:
    build:
      targets:
        LeaveNow: all
    run:
      config: Release
      environmentVariables:
        MOCK_DATA: NO
